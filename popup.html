<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 250px;
        margin: 0;
        padding: 14px;
        font-family: "Segoe UI", system-ui, sans-serif;
        font-size: 13px;
        background: #181818;
        color: #f1f1f1;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 14px;
        font-weight: 600;
      }
      label {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 0;
        cursor: pointer;
      }
      input[type="number"] {
        width: 56px;
        padding: 2px 4px;
        background: #0f0f0f;
        color: #f1f1f1;
        border: 1px solid #444;
        border-radius: 4px;
      }
      .hint {
        margin: 2px 0 0 22px;
        font-size: 11px;
        line-height: 1.4;
        opacity: 0.6;
      }
      .row {
        display: flex;
        gap: 6px;
        margin-top: 12px;
      }
      button {
        flex: 1;
        padding: 9px;
        border: none;
        border-radius: 18px;
        font-size: 13px;
        font-weight: 600;
        white-space: nowrap;
        cursor: pointer;
      }
      #copy {
        background: #2a2a2a;
        color: #f1f1f1;
      }
      #copy:hover {
        background: #3a3a3a;
      }
      #download {
        background: #3ea6ff;
        color: #0f0f0f;
      }
      #download:hover {
        background: #65b8ff;
      }
      #status {
        margin-top: 10px;
        min-height: 16px;
        font-size: 12px;
        line-height: 1.4;
        opacity: 0.9;
      }
      #status.error {
        color: #f28b82;
      }
    </style>
  </head>
  <body>
    <h1>YT Transcript Grabber</h1>

    <label>
      <input type="checkbox" id="removeBracketed" /> Remove [bracketed] tags
    </label>
    <div class="hint">[music], [laughter], [clears throat]</div>

    <label>
      <input type="checkbox" id="onePerLine" /> One caption per line
    </label>
    <div class="hint">Off: joined into one flowing block</div>

    <label>Wrap at <input type="number" id="wrapAt" min="0" max="200" step="10" /> chars</label>
    <div class="hint">0 = no line breaks at all</div>

    <div class="row">
      <button id="copy">Copy</button>
      <button id="download">Download .txt</button>
    </div>
    <div id="status"></div>

    <script src="popup.js"></script>
  </body>
</html>
